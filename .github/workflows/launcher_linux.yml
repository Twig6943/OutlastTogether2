name: Build Launcher (Linux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build container image
        # Gpu somewhat needed
        run: podman build --device /dev/dri -t outlast-launcher -f CI/Containerfile_launcher .

      - name: Extract binary from image
        run: |
          id=$(podman create localhost/outlast-launcher)
          podman cp "$id":/build/OutlastLauncher.exe ./OutlastLauncher.exe
          podman rm "$id"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Launcher
          path: OutlastLauncher.exe
          archive: false
